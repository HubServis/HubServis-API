    #Postgres DB
    postgres:
        container_name: hub-servis-postgres
        image: postgres
        environment:
            POSTGRES_USER: hubservis
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: hubservis
        ports:
            - 5432:5432
        volumes:
            - postgresdata:/data
        # networks:
        #   - hubservis

    dragonfly:
        image: "docker.dragonflydb.io/dragonflydb/dragonfly"
        ulimits:
            memlock: 1
        ports:
            - 6379:6379
        volumes:
            - dragonflydata:/data
        cpus: "2"
        mem_limit: "2GB"

volumes:
    dragonflydata:
    postgresdata:
